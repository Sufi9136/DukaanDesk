<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d9488">
    <title>Offline - DukaanDesk</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #1b2430; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .box { max-width: 340px; }
        h1 { margin: 10px 0; font-size: 24px; }
        p { color: #aab4c3; line-height: 1.5; }
        button { background: #0d9488; color: #fff; border: 0; padding: 10px 22px; border-radius: 6px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <img src="assets/icons/icon-192.png" width="96" height="96" alt="">
        <h1>You are offline</h1>
        <p>DukaanDesk needs an internet connection to save bills and stock. Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
